<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMS Spam Filter Project</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 400px; }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; }
        input[type="submit"] { background: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        input[type="submit"]:hover { background: #0056b3; }
        .result { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SMS Spam Detection System</h2>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Type or paste your SMS message here..." required></textarea><br>
            <input type="submit" value="Check Spam">
        </form>

        {% if prediction %}
            <div class="result">
                <p>Message: "{{ original_text }}"</p>
                <p>Result: {{ prediction }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
